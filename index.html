<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaylı Sarkaç Simülasyonu</title>
   <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; /* Kenar boşluğu eklendi */
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: row;
            /* DÜZELTME: Masaüstü için maksimum genişlik eklendi */
            max-width: 1200px; 
            width: 100%;
            overflow: hidden;
        }

        .controls {
            /* Genişlik 320px olarak güncellendi (orijinal hali) */
            width: 320px;
            flex-shrink: 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #fff;
            font-size: 24px;
        
		
            font-weight: 600;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .checkbox-group {
            margin-bottom: 25px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .checkbox-label input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-with-unit {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            text-align: right;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
        }

        .unit {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            min-width: 40px;
        }

        .radio-group {
            margin-top: 25px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .radio-option input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .canvas-area {
            flex: 1; /* Orijinal flex: 1 olarak güncellendi */
            min-width: 0;
            padding: 10px;
            display: flex;
         
            justify-content: center;
            background: #ffffff;
            overflow: hidden; 
        }

        canvas {
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            height: auto;
            display: block;
        }

   
        
        /* * DÜZELTME: @media (min-width: 801px) bloğu, 
         * kayma sorununa yol açtığı için kaldırıldı.
         */

        /* Mobil (kaydırmalı) görünüm KORUNDU */
        @media (max-width: 800px) {
            /* padding: 0 ve min-height: 0 eklendi */
            body {
                padding: 0;
                min-height: 0;
            }
            .container {
                flex-direction: column; 
                width: 100%;
                height: auto; 
                border-radius: 0; /* Mobilde tam ekran */
            }
            
            .controls {
                flex-basis: auto; 
                width: 100%; 
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            }
            
            .canvas-area {
                border-left: none; 
                width: 100%;
                /* ANAHTAR: Yatay kaydırmayı etkinleştir */
                overflow-x: auto; 
                /* ANAHTAR: Kaydırmanın çalışması için içeriği sola hizala */
                justify-content: flex-start;
                align-items: flex-start;
                padding: 20px; /* Mobilde padding azaltıldı */
            }
            
            canvas {
                /* ANAHTAR: Canvas'ı 540x400'e sabitle (mobil kaydırmayı zorla) */
                width: 540px;
                max-width: 540px; /* max-width: 100% 'ü ezer */
                height: 400px; 
            }
			
			.input-group {
    margin-bottom: 10px;
    /* YENİ EKLENENLER */
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 5px;
}

label {
    /* display: block; KALDIRILDI */
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    /* margin-bottom: 8px; KALDIRILDI */
    /* YENİ EKLENENLER */
    white-space: nowrap;
    flex-shrink: 0;
}
  .checkbox-group {
            margin-bottom: 15px;
        }
}

        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="controls">
            
            <h1></h1>

            <div class="button-group">
                <button class="primary" id="WF19_bu2">Başlat</button>
                <button class="secondary" id="WF19_bu1">Geri</button>
            </div>

            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="WF19_cbSlow">
                    Ağır çekim
                </label>
            </div>
            
            <div class="input-group">
                <label for="WF19_ipD">Yay sabiti:</label>
                <div class="input-with-unit">
                    <input type="text" id="WF19_ipD" value="20,0">
                    <span class="unit">N/m</span>
                </div>
            </div>
            
            <div class="input-group">
                <label for="WF19_ipM">Kütle:</label>
                <div class="input-with-unit">
                    <input type="text" id="WF19_ipM" value="5,00">
                    <span class="unit">kg</span>
                </div>
            </div>
            
            <div class="input-group">
                <label for="WF19_ipG">Yer çekimi ivmesi:</label>
                <div class="input-with-unit">
                    <input type="text" id="WF19_ipG" value="9,81">
                    <span class="unit">m/s²</span>
                </div>
            </div>

            <div class="input-group">
                <label for="WF19_ipA">Genlik:</label>
                <div class="input-with-unit">
                    <input type="text" id="WF19_ipA" value="0,0500">
                    <span class="unit">m</span>
                </div>
            </div>

            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="WF19_rbY" name="bg" value="on" checked>
                    <label for="WF19_rbY" style="color:#ff0000">Uzama (yer değiştirme)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="WF19_rbV" name="bg" value="on">
                    <label for="WF19_rbV" style="color:#C3C800">Hız</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="WF19_rbA" name="bg" value="on">
                    <label for="WF19_rbA" style="color: #82cea4;">İvme</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="WF19_rbF" name="bg" value="on">
                    <label for="WF19_rbF" style="color:#9999FF">Kuvvet</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="WF19_rbE" name="bg" value="on">
                    <label for="WF19_rbE" style="color:#dddfff">Enerji</label>
                </div>
            </div>
            
        </div>

        <div class="canvas-area">
            <canvas width="540" height="400" id="WF19_cv">HTML5-Canvas desteklenmiyor!</canvas>
        </div>
    </div>
        
    <script src="app.js"></script>

</body>
</html>
